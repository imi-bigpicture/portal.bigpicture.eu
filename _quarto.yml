project:
  type: website
  output-dir: docs

website:
  title: Bigpicture
  favicon: favicon.ico
  description: >
    A central repository of digital pathology slides from biomedical research projects to boost the development of artificial intelligence
  image: images/bp-logo.png
  page-footer:
    background: "#1c007b"
    foreground: white

  page-navigation: true
  navbar:
    title: false
    logo: images/bp-logo-one-line.png
    logo-alt: BigPicture
    background: white
    foreground: "#1c007b"
    collapse-below: lg
    pinned: true
    # PROTOTYPE (#15): menu mirrors the home page's five purposes. Was: Home,
    # Datasets, Algorithms, Compute, Software, Metrics (see main).
    left:
      - href: index.qmd
        text: Home
      - text: Explore data
        menu:
          - href: https://datasets.bp.nbis.se/
            text: Browse datasets
          - href: metrics/index.qmd
            text: Metrics
          - href: https://grafana.bp.nbis.se/public-dashboards/c465fe145d7844b59d7eea87be8e199d#/
            text: Archive status
            target: _blank
          - href: tools/data-exploration.qmd
            text: Data exploration tools
      - text: Explore tools
        menu:
          - href: tools/index.qmd
            text: All tools
          - href: tools/data-exploration.qmd
            text: Data exploration tools
          - href: tools/data-access.qmd
            text: Data access tools
          - href: tools/data-contributing.qmd
            text: Data contributing tools
          - href: tools/tool-contributing.qmd
            text: Tool contributing tools
      - text: Access data
        menu:
          - href: https://datasets.bp.nbis.se/
            text: Browse datasets
          - href: https://bp-rems.sd.csc.fi/
            text: Apply in REMS
          - href: datasets/download/downloading-data.qmd
            text: Download guide
          - href: tools/data-access.qmd
            text: Data access tools
      - text: Contribute data
        menu:
          - href: datasets/submission/plan-a-contribution.qmd
            text: Plan a contribution
          - href: datasets/submission/index.qmd
            text: Submission manual
          - href: tools/data-contributing.qmd
            text: Data contributing tools
      - text: Contribute tools
        menu:
          - href: algorithms/index.qmd
            text: What's planned
          - text: "---"
          - text: "Coming later"
          - href: algorithms/browse/index.qmd
            text: Browse algorithms
          - href: algorithms/try/index.qmd
