project:
  type: website
  output-dir: docs

website:
  title: Bigpicture
  favicon: favicon.ico
  description: >
    A central repository of digital pathology slides from biomedical research projects to boost the development of artificial intelligence
  image: images/bp-logo.png
  page-footer:
    background: "#1c007b"
    foreground: white

  page-navigation: true
  navbar:
    title: false
    logo: images/bp-logo-one-line.png
    logo-alt: BigPicture
    background: white
    foreground: "#1c007b"
    collapse-below: lg
    pinned: true
    # PROTOTYPE (#15): menu mirrors the home page's six choices. Was: Home,
    # Datasets, Algorithms, Compute, Software, Metrics (see main).
    left:
      - href: index.qmd
        text: Home
      - text: Explore data
        menu:
          - href: https://datasets.bp.nbis.se/
            text: Browse datasets
          - href: metrics/index.qmd
            text: Metrics
          - href: https://grafana.bp.nbis.se/public-dashboards/c465fe145d7844b59d7eea87be8e199d#/
            text: Archive status
            target: _blank
          - href: services/data-exploration.qmd
            text: Data exploration services
      - text: Explore services
        menu:
          - href: services/index.qmd
            text: All services
          - href: services/data-exploration.qmd
            text: Data exploration services
          - href: services/data-access.qmd
            text: Data access services
          - href: services/data-contributing.qmd
            text: Data contributing services
          - href: services/model-access.qmd
            text: Model access services
          - href: services/model-contributing.qmd
            text: Model contributing services
      - text: Access data
        menu:
          - href: https://datasets.bp.nbis.se/
            text: Browse datasets
          - href: https://bp-rems.sd.csc.fi/
            text: Apply in REMS
          - href: datasets/download/downloading-data.qmd
            text: Download guide
          - href: services/data-access.qmd
            text: Data access services
      # PROTOTYPE (#15): models are both accessed and contributed; bare placeholders
      # until the models team provides content.
      - text: Access models
        href: models/access.qmd
      - text: Contribute data
        menu:
          - href: datasets/submission/plan-a-contribution.qmd
            text: Plan a contribution
          - href: datasets/submission/index.qmd
            text: Submission manual
          - href: services/data-contributing.qmd
            text: Data contributing services
      - text: Contribute models
        href: models/contribute.qmd


  
  sidebar:
    - id: submit
      title: Submission manual
      style: docked  # PROTOTYPE (#15): was floating
      collapse-level: 1
      align: left
      contents:
        # PROTOTYPE (#15): no "Start here" header (it read as a site-wide start);
        # the three entry pages sit at the top of the guide. The overview is called
        # "Submission manual", as it's linked from the home page and the menu.
        - text: Plan a contribution
          file: datasets/submission/plan-a-contribution.qmd
        - text: Submission manual
          file: datasets/submission/index.qmd
        - text: Key concepts
          file: datasets/submission/key-concepts.qmd
        # PROTOTYPE (#15): upload guide untangled (option B). Was one flat A-J list
        # with Best Practices between A and B and Prepare for production after J.
        - section: "Path 1: bp-submission-pipeline"
          contents:
            - section: Set up (A–G)
              contents:
                - text: A. Prerequisites
                  file: datasets/submission/bp-submission-pipeline/prerequisites.qmd
                - text: B. GitHub access
                  file: datasets/submission/bp-submission-pipeline/github-access.qmd
                - text: C. Install package
                  file: datasets/submission/bp-submission-pipeline/install-package.qmd
                - text: D. Configure
                  file: datasets/submission/bp-submission-pipeline/configure.qmd
                - section: E. Reference data
                  href: datasets/submission/bp-submission-pipeline/reference-data.qmd
                  contents:
                    - text: "model.json"
                      file: datasets/submission/bp-submission-pipeline/reference-data-model.qmd
                    - text: "mappers.xlsx"
                      file: datasets/submission/bp-submission-pipeline/reference-data-mappers.qmd
                    - text: "Staining mapping"
                      file: datasets/submission/bp-submission-pipeline/reference-data-staining.qmd
                - text: F. TLS + credentials
                  file: datasets/submission/bp-submission-pipeline/tls-credentials.qmd
                - text: G. Preflight + boot
                  file: datasets/submission/bp-submission-pipeline/boot.qmd
            - section: Test run (H–J)
              contents:
                - text: H. Run a submission test
                  file: datasets/submission/bp-submission-pipeline/run-submission.qmd
                - text: I. Validate the bundle
                  file: datasets/submission/bp-submission-pipeline/validate.qmd
                - text: J. Upload to BigPicture
                  file: datasets/submission/bp-submission-pipeline/upload.qmd
            - section: Go to production
              contents:
                - text: Prepare for production
                  file: datasets/submission/bp-submission-pipeline/prepare-for-production.qmd
                - text: Best Practices
                  file: datasets/submission/bp-submission-pipeline/best-practices.qmd
        - section: "Path 2: Direct components"
          contents:
            - text: Direct components overview
              file: datasets/submission/direct-components/index.qmd
        - section: "Path 3: Direct upload (sda-cli)"
          contents:
            - text: "Direct upload: prerequisites"
              file: datasets/submission/direct-upload/prerequisites.qmd
            - text: Prepare data
              file: datasets/submission/direct-upload/prepare-data.qmd
            - text: Validate metadata
              file: datasets/submission/direct-upload/validate-metadata.qmd
            - text: Upload (sda-cli)
              file: datasets/submission/direct-upload/upload.qmd
        - section: Help
          contents:
            - text: FAQ
              file: datasets/submission/faq.qmd
            - text: Add a landing page
              file: datasets/submission/add-landing-page.qmd
            - text: Support
              file: datasets/submission/support.qmd
            - text: Community
              file: datasets/submission/community.qmd

    - id: access
      title: Access
      style: docked  # PROTOTYPE (#15): was floating
      collapse-level: 2
      align: left
      contents:
        - download/downloading-data.qmd

    # PROTOTYPE (#15): service pages, generated by prototype/friendly-ui/gen_services.py.
    # Each service is listed once under "All services"; sections link to them.
    - id: services
      title: Services
      style: docked
      collapse-level: 2
      align: left
      contents:
        - services/index.qmd
        - section: By purpose
          contents:
            - services/data-exploration.qmd
            - services/data-access.qmd
            - services/data-contributing.qmd
            - services/model-access.qmd
            - services/model-contributing.qmd
        - section: All services
          contents:
            - services/lsaai.qmd
            - services/perun.qmd
            - services/slidetap.qmd
            - services/data-transporter.qmd
            - services/metadata-standard.qmd
            - services/rems.qmd
            - services/discovery.qmd
            - services/landing-pages.qmd
            - services/metrics.qmd
            - services/grafana.qmd

format:
  html:
    theme:
      - cosmo
      - custom.scss
    # PROTOTYPE (#15): variant switcher and sidebar toggle on every page.
    include-after-body: prototype/friendly-ui/switcher.html
    code-copy: true
    code-overflow: wrap
    toc: false  # PROTOTYPE (#15): was true
    # PROTOTYPE (#15): this branch is published as a reviewer copy at /preview/;
    # keep it out of search engines. index.qmd repeats this (it sets its own header).
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow" />
    # PROTOTYPE (#15): wider content column; with the TOC gone the right-hand
    # margin column only held empty space. Defaults: body 800px, margin 250px.
    grid:
      body-width: 1200px
      margin-width: 0px
