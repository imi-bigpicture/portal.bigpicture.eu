  sidebar:
    - id: submit
      title: Submission manual
      style: docked  # PROTOTYPE (#15): was floating
      collapse-level: 1
      align: left
      contents:
        - section: Start here
          contents:
            # PROTOTYPE (#15): Plan a contribution first; the overview is called
            # "Submission manual", as it's linked from the home page and the menu.
            - text: Plan a contribution
