<!--
  PROTOTYPE v3 — throwaway (branch prototype/service-pages-v3). Do not merge.
  Service pages are one fact-sheet form (no variants). "Explore services" has one
  list, filtered by purpose via #exploration|#access|#contributing and shown as
  ?variant=A (rows) or B (tiles). No-op on pages without .proto-v.
-->
<style>
  /* status badge */
  .proto-status { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 700;
    letter-spacing: .02em; vertical-align: middle; white-space: nowrap; line-height: 1.5; }
  .proto-status.s-prod  { background: #e3f4ea; color: #15603a; }
  .proto-status.s-dev   { background: #fff1d6; color: #8a5300; }
  .proto-status.s-plan  { background: #eceaf3; color: #4b4566; }

  /* fact sheet */
  .proto-facts dl { display: grid; grid-template-columns: 13rem 1fr; margin: 1rem 0 2rem; }
  .proto-facts dt { color: #1c007b; padding: .6rem 1rem .6rem 0; border-top: 1px solid #dee2e6; }
  .proto-facts dd { margin: 0; padding: .6rem 0; border-top: 1px solid #dee2e6; }
  .proto-facts dd p { margin: 0 0 .4rem; }
  .proto-facts dd p:last-child { margin-bottom: 0; }
  .proto-facts dd ul, .proto-facts dd ol { margin: 0; padding-left: 1.1rem; }
  @media (max-width: 45rem) { .proto-facts dl { grid-template-columns: 1fr; } .proto-facts dd { border-top: 0; padding-top: 0; } }
  .proto-none { color: #888; font-style: italic; }

  /* support field: one contact, then quiet detail */
  .proto-help a.proto-mail { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .8rem; border-radius: .5rem;
    background: rgba(28, 0, 123, .08); font-weight: 700; text-decoration: none; }
  .proto-help a.proto-mail:hover { background: #1c007b; color: #fff; }
  .proto-help .proto-muted { color: #6c757d; font-size: .92rem; }

  /* service lists — A: rows */
  .proto-v { display: none; }
  body[data-proto-v="A"] .proto-v[data-v="A"],
  body[data-proto-v="B"] .proto-v[data-v="B"] { display: block; }
  .proto-rows > div { position: relative; display: grid; grid-template-columns: 15rem 9rem 1fr; gap: 1rem; align-items: center;
    padding: .6rem .5rem; border-bottom: 1px solid #dee2e6; border-radius: .375rem; }
  .proto-rows > div:hover { background: #f2f0f7; }
  .proto-rows p { margin: 0; }
  .proto-rows a { font-weight: 700; text-decoration: none; }
  @media (max-width: 50rem) { .proto-rows > div { grid-template-columns: 1fr; gap: .2rem; } }

  /* purpose filter */
  .proto-filter { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.25rem 0 1rem; }
  .proto-filter a { padding: .35rem .9rem; border: 1px solid #dee2e6; border-radius: 999px; font-weight: 700; font-size: .95rem;
    text-decoration: none; color: #1c007b; }
  .proto-filter a:hover { border-color: #1c007b; }
  .proto-filter a.active { background: #1c007b; border-color: #1c007b; color: #fff; }
  .proto-intro { display: none; color: #6c757d; margin-bottom: 1rem; }
  .proto-intro.active { display: block; }
  .proto-hidden { display: none !important; }

  /* B: tiles get a status and a line under the title */
  .bp-tile .proto-status { align-self: flex-start; }
  .bp-tile .proto-line { color: #6c757d; font-size: .95rem; }

  .proto-bar {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 2000;
    display: flex; gap: .75rem; align-items: center; padding: .45rem .8rem;
    background: #111; color: #fff; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    font: 600 .85rem/1.2 system-ui, sans-serif;
  }
  .proto-bar button { background: #333; color: #fff; border: 0; border-radius: 999px; padding: .3rem .65rem; cursor: pointer; }
  .proto-bar button:hover { background: #555; }
  .proto-bar small { opacity: .65; font-weight: 400; }
</style>

<script>
(function () {
  if (!document.querySelector('.proto-v')) return;
  var VARIANTS = { A: 'Rows', B: 'Tiles' };
  var keys = Object.keys(VARIANTS);
  var p0 = new URLSearchParams(location.search).get('variant');
  var v = VARIANTS[p0] ? p0 : 'A';

  function apply() {
    document.body.dataset.protoV = v;
    label.innerHTML = v + ' — ' + VARIANTS[v] + ' <small>(← →)</small>';
    var p = new URLSearchParams(location.search); p.set('variant', v);
    history.replaceState(null, '', location.pathname + '?' + p.toString() + location.hash);
  }

  // purpose filter: #exploration | #access | #contributing (anything else: all)
  function filter() {
    var want = location.hash.slice(1);
    if (!document.querySelector('.proto-filter a[data-purpose="' + want + '"]') || want === 'all') want = 'all';
    document.querySelectorAll('.proto-filter a').forEach(function (a) { a.classList.toggle('active', a.dataset.purpose === want); });
    document.querySelectorAll('.proto-intro').forEach(function (el) { el.classList.toggle('active', el.dataset.purpose === want); });
    document.querySelectorAll('.proto-v [data-purpose]').forEach(function (el) {
      el.classList.toggle('proto-hidden', want !== 'all' && el.dataset.purpose.split(' ').indexOf(want) < 0);
    });
  }
  window.addEventListener('hashchange', filter);
  filter();
  function step(d) { v = keys[(keys.indexOf(v) + d + keys.length) % keys.length]; apply(); }

  var bar = document.createElement('div'); bar.className = 'proto-bar';
  var prev = document.createElement('button'); prev.textContent = '←'; prev.onclick = function () { step(-1); };
  var label = document.createElement('span');
  var next = document.createElement('button'); next.textContent = '→'; next.onclick = function () { step(1); };
  bar.append(prev, label, next); document.body.appendChild(bar);

  document.addEventListener('keydown', function (e) {
    var t = e.target; if (t.closest && t.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  apply();
})();
</script>
