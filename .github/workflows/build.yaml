name: Publish to Github Pages

on:
  push:
    branches:
    - main
  workflow_dispatch:

# Never let two runs publish over each other.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.4.550

    - name: Checkout files
      uses: actions/checkout@v3
      with:
        # The live site is always main, even when the workflow is run by hand
        # from another branch.
        ref: main

    - name: Render
      uses: quarto-dev/quarto-actions/render@v2
      env:
        CAPTCHAKEY: ${{ vars.CAPTCHAKEY }}
        SKULD: ${{ vars.SKULD }}
      with:
        path: .
        to: html

    - name: Publish to Github Pages
      uses: quarto-dev/quarto-actions/publish@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        target: gh-pages
        render: false

